[server]
address = "127.0.0.1"
headless = true
enableStaticServing = false
enableCORS = true
enableXsrfProtection = true
maxUploadSize = 1

[browser]
gatherUsageStats = false

[client]
showErrorDetails = "none"
toolbarMode = "viewer"

[theme]
font = "IBM Plex Sans Arabic, Tahoma, Arial, sans-serif"
metricValueFontSize = "2rem"
headingFontWeights = [600, 600, 600, 600, 600, 600]
baseRadius = "0.9rem"
buttonRadius = "0.65rem"
showWidgetBorder = true
showSidebarBorder = true
paddingTop = "1rem"
paddingBottom = "2rem"

[theme.sidebar]
paddingTop = "1rem"

[theme.light]
primaryColor = "#087F8C"
backgroundColor = "#FAFBFD"
secondaryBackgroundColor = "#F1F5F9"
textColor = "#102544"
borderColor = "#E4EAF1"
chartCategoricalColors = ["#12B6A6", "#1584BD", "#6654D9"]
greenColor = "#16A573"
orangeColor = "#F59E0B"

[theme.light.sidebar]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F0F8FA"
textColor = "#102544"
borderColor = "#E4EAF1"
primaryColor = "#087F8C"

[theme.dark]
primaryColor = "#6038E8"
backgroundColor = "#0D1429"
secondaryBackgroundColor = "#18213D"
textColor = "#E7EDF5"
borderColor = "#304256"

[theme.dark.sidebar]
backgroundColor = "#111B38"
secondaryBackgroundColor = "#1E2A4D"
textColor = "#E7EDF5"
